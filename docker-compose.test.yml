# Postgres for local + CI integration tests. Ephemeral; data is not persisted.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iamfriendof
      POSTGRES_PASSWORD: iamfriendof
      POSTGRES_DB: iamfriendof_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iamfriendof -d iamfriendof_test"]
      interval: 2s
      timeout: 3s
      retries: 20
