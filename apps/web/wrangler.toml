name = "iamfriendof"
main = "src/main.ts"
compatibility_date = "2024-06-01"
compatibility_flags = ["nodejs_compat"]

# Non-secret vars. Secrets (JWT_SECRET, DATABASE_URL, EMAIL_API_KEY) are set with
# `wrangler secret put <NAME>` or in the Cloudflare dashboard, never committed.
[vars]
DEPLOY_PHASE = "0"
RATE_LIMIT_PER_MINUTE = "1000"

# R2 bucket binding for profile images (free tier: 10 GB, zero egress).
# Create with: wrangler r2 bucket create iamfriendof-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "iamfriendof-media"

# Cron trigger for deferred Phase 0 async work (emails, PM recalc, index refresh).
[triggers]
crons = ["*/5 * * * *"]
